<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Захист від темного режиму -->
    <meta name="color-scheme" content="light only">
    <title>Етно Бласт 3.3 (Фінал)</title>
    <style>
        :root {
            --bg-color: #f5f2eb;
            --fabric-color: #fefdfb;
            --ethno-red: #cc2323;
            --ethno-black: #1a1a1a;
            --grid-line: #e3dac9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Забороняє скрол екрану під час гри */
        }

        /* Обманюємо примусовий темний режим за допомогою фонових градієнтів */
        html, body {
            background-color: var(--bg-color) !important;
            /* Градієнт блокує інверсію фону на телефонах */
            background-image: linear-gradient(var(--bg-color), var(--bg-color)) !important; 
            color: #1a1a1a !important;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            position: relative;
            z-index: 10;
        }

        /* Декоративна сітка на фоні */
        .bg-pattern {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#d5cebe 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            z-index: 1; pointer-events: none;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background-image: linear-gradient(var(--fabric-color), var(--fabric-color)) !important;
            padding: 12px 16px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 4px solid var(--ethno-red);
            border-bottom: 4px solid var(--ethno-black);
        }

        .title-area h1 { font-size: 18px; font-weight: 900; color: #1a1a1a !important; text-transform: uppercase; }
        .title-area span { font-size: 11px; color: var(--ethno-red) !important; font-weight: bold; }
        .stats { display: flex; gap: 12px; }
        .stat-box { text-align: right; }
        .stat-label { font-size: 9px; text-transform: uppercase; color: #555 !important; font-weight: bold; }
        .stat-val { font-size: 20px; font-weight: 800; color: #1a1a1a !important; }
        #score { color: var(--ethno-red) !important; }

        .board-container {
            background-image: linear-gradient(var(--fabric-color), var(--fabric-color)) !important;
            padding: 8px; border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 1px solid var(--grid-line);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px; width: 100%; aspect-ratio: 1;
            background-image: linear-gradient(var(--grid-line), var(--grid-line)) !important;
            border-radius: 12px; padding: 4px;
        }

        .cell {
            background-image: linear-gradient(var(--fabric-color), var(--fabric-color)) !important;
            border-radius: 6px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .cell::after { content: "·"; color: #d0c8b8 !important; font-size: 16px; }
        .cell.filled::after { content: "" !important; }

        .ornament {
            position: relative; display: flex; align-items: center; justify-content: center;
            border-radius: 5px; width: 100%; height: 100%;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.15);
        }
        .ornament::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 3px);
            z-index: 1;
        }
        .ornament::after { position: relative; z-index: 2; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        .ornament-1 { background-image: linear-gradient(135deg, #1a1a1a, #333) !important; color: #ff4d4d !important; } .ornament-1::after { content: "✥"; }
        .ornament-2 { background-image: linear-gradient(135deg, #e09f1b, #f3b63a) !important; color: #1e5230 !important; } .ornament-2::after { content: "✺"; }
        .ornament-3 { background-image: linear-gradient(135deg, #cc2323, #a01616) !important; color: #ffd700 !important; } .ornament-3::after { content: "✤"; }
        .ornament-4 { background-image: linear-gradient(135deg, #2a6f43, #3c925c) !important; color: #ffffff !important; } .ornament-4::after { content: "✣"; }
        .ornament-5 { background-image: linear-gradient(135deg, #0d3b66, #1a5b99) !important; color: #f4d35e !important; } .ornament-5::after { content: "✸"; }
        .ornament-6 { background-image: linear-gradient(135deg, #faf0ca, #fcebb6) !important; color: #d62828 !important; } .ornament-6::after { content: "✿"; }

        .cell.hovered { background-image: linear-gradient(rgba(204, 35, 35, 0.2), rgba(204, 35, 35, 0.2)) !important; box-shadow: inset 0 0 6px var(--ethno-red) !important; }
        .cell.hovered::after { content: "" !important; }

        .rack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 95px; }
        .rack-slot {
            background-image: linear-gradient(var(--fabric-color), var(--fabric-color)) !important;
            border-radius: 16px; height: 95px;
            display: flex; align-items: center; justify-content: center;
            border: 1px dashed #ccc;
        }

        .draggable-piece { display: grid; gap: 3px; position: relative; }
        
        .draggable-piece.dragging {
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none; /* Щоб бачити поле крізь фігуру */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        .p-cell { display: flex; align-items: center; justify-content: center; }

        .clearing { animation: clearAnim 0.3s forwards !important; }
        @keyframes clearAnim { 100% { transform: scale(0); opacity: 0; } }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background-image: linear-gradient(#fff, #fff) !important; padding: 25px; border-radius: 24px; text-align: center; border: 3px solid var(--ethno-red); width: 90%; max-width: 300px; }
        .modal h2 { color: #1a1a1a !important; margin-bottom: 10px; }
        .btn { background: #1a1a1a; color: #fff; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="game-wrapper">
    <header>
        <div class="title-area">
            <h1>Етно Бласт</h1>
            <span>❖ СВЯТО ОРНАМЕНТІВ</span>
        </div>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Бали</div>
                <div id="score" class="stat-val">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Рекорд</div>
                <div id="high-score" class="stat-val">0</div>
            </div>
        </div>
    </header>

    <div class="board-container">
        <div id="board" class="board"></div>
    </div>

    <div id="rack" class="rack">
        <div class="rack-slot" data-slot="0"></div>
        <div class="rack-slot" data-slot="1"></div>
        <div class="rack-slot" data-slot="2"></div>
    </div>
</div>

<div id="game-over-modal" class="overlay">
    <div class="modal">
        <h2>Нитка закінчилась!</h2>
        <p style="color:#1a1a1a !important; margin-bottom: 15px;">Більше немає куди покласти орнамент.</p>
        <div style="font-size: 16px; margin-bottom: 20px; color:#1a1a1a !important;">
            Рахунок: <strong id="final-score" style="color: #cc2323 !important; font-size: 24px;">0</strong>
        </div>
        <button id="restart-btn" class="btn">Грати ще раз</button>
    </div>
</div>

<script>
    const BOARD_SIZE = 8;
    const boardEl = document.getElementById('board');
    const rackSlots = document.querySelectorAll('.rack-slot');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const finalScoreEl = document.getElementById('final-score');
    const gameOverModal = document.getElementById('game-over-modal');

    let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    let score = 0;
    let highScore = localStorage.getItem('vyshyvanka_blast_max') || 0;
    highScoreEl.textContent = highScore;

    const SHAPES = [
        { matrix: [[1]], style: 'ornament-1' },
        { matrix: [[1, 1]], style: 'ornament-6' },
        { matrix: [[1], [1]], style: 'ornament-2' },
        { matrix: [[1, 1], [1, 1]], style: 'ornament-3' }, 
        { matrix: [[1, 1, 1]], style: 'ornament-4' },
        { matrix: [[1], [1], [1]], style: 'ornament-5' },
        { matrix: [[1, 0], [1, 1]], style: 'ornament-1' }, 
        { matrix: [[0, 1], [1, 1]], style: 'ornament-6' },
        { matrix: [[0, 1, 0], [1, 1, 1]], style: 'ornament-4' },
        { matrix: [[1, 1, 1, 1]], style: 'ornament-5' }
    ];

    let rackPieces = [null, null, null];
    let activePieceEl = null; // Поточна фігура, яку ми тягнемо

    function createBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }
    }

    function drawBoard() {
        const cells = boardEl.querySelectorAll('.cell');
        cells.forEach(cell => {
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            cell.className = 'cell';
            if (board[r][c] !== 0) {
                cell.classList.add('filled', 'ornament', board[r][c]);
            }
        });
    }

    function generatePiece(slotIndex) {
        const base = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const piece = { matrix: base.matrix, style: base.style };
        rackPieces[slotIndex] = piece;

        const slot = rackSlots[slotIndex];
        slot.innerHTML = '';

        const pieceEl = document.createElement('div');
        pieceEl.className = 'draggable-piece';
        pieceEl.dataset.slot = slotIndex;
        pieceEl.style.gridTemplateRows = `repeat(${piece.matrix.length}, 1fr)`;
        pieceEl.style.gridTemplateColumns = `repeat(${piece.matrix[0].length}, 1fr)`;

        const size = 22;
        pieceEl.style.width = `${piece.matrix[0].length * (size + 3)}px`;

        for (let r = 0; r < piece.matrix.length; r++) {
            for (let c = 0; c < piece.matrix[r].length; c++) {
                const pCell = document.createElement('div');
                pCell.className = 'p-cell';
                if (piece.matrix[r][c] === 1) {
                    pCell.classList.add('ornament', piece.style);
                    pCell.style.width = `${size}px`;
                    pCell.style.height = `${size}px`;
                } else {
                    pCell.style.opacity = '0';
                }
                pieceEl.appendChild(pCell);
            }
        }

        slot.appendChild(pieceEl);
        initDrag(pieceEl, piece);
    }

    function fillRack() {
        for (let i = 0; i < 3; i++) generatePiece(i);
    }

    // --- НАДІЙНИЙ НОВИЙ КОД ПЕРЕТЯГУВАННЯ ---
    let dragData = null;

    function initDrag(pieceEl, piece) {
        pieceEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            activePieceEl = pieceEl;
            
            const boardCell = boardEl.querySelector('.cell').getBoundingClientRect();
            
            // Збільшуємо фігуру до розміру поля
            pieceEl.querySelectorAll('.p-cell').forEach(c => {
                c.style.width = `${boardCell.width}px`;
                c.style.height = `${boardCell.height}px`;
            });
            pieceEl.style.width = `${piece.matrix[0].length * boardCell.width + (piece.matrix[0].length - 1) * 4}px`;

            const rect = pieceEl.getBoundingClientRect();
            dragData = {
                piece: piece,
                slotIndex: parseInt(pieceEl.dataset.slot),
                offsetX: rect.width / 2,
                offsetY: rect.height / 2,
                shiftY: 60 // Підіймаємо над пальцем
            };

            pieceEl.classList.add('dragging');
            movePiece(e.clientX, e.clientY);

            // ВАЖЛИВО: вішаємо слухачі руху на ВЕСЬ документ, а не на фігуру!
            document.addEventListener('pointermove', onPointerMove, { passive: false });
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);
        });
    }

    function onPointerMove(e) {
        if (!activePieceEl) return;
        e.preventDefault(); // Зупиняє прокрутку екрану на телефонах
        movePiece(e.clientX, e.clientY);
    }

    function movePiece(clientX, clientY) {
        if (!activePieceEl || !dragData) return;

        // Рухаємо фігуру за пальцем
        activePieceEl.style.left = `${clientX - dragData.offsetX}px`;
        activePieceEl.style.top = `${clientY - dragData.offsetY - dragData.shiftY}px`;

        clearHover();

        // Шукаємо клітинку під ПЕРШИМ квадратиком фігури
        const firstBlock = activePieceEl.querySelector('.ornament');
        if (firstBlock) {
            const rect = firstBlock.getBoundingClientRect();
            const checkX = rect.left + rect.width / 2;
            const checkY = rect.top + rect.height / 2;

            // Оскільки у фігури pointer-events: none, ми бачимо клітинку під нею
            const elem = document.elementFromPoint(checkX, checkY);
            if (elem && elem.classList.contains('cell')) {
                const r = parseInt(elem.dataset.row);
                const c = parseInt(elem.dataset.col);
                if (canPlace(dragData.piece.matrix, r, c)) {
                    showHover(dragData.piece.matrix, r, c);
                }
            }
        }
    }

    function onPointerUp(e) {
        if (!activePieceEl) return;

        // Знімаємо глобальні слухачі
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        document.removeEventListener('pointercancel', onPointerUp);

        activePieceEl.classList.remove('dragging');
        clearHover();

        let placed = false;
        const firstBlock = activePieceEl.querySelector('.ornament');

        if (firstBlock) {
            const rect = firstBlock.getBoundingClientRect();
            const checkX = rect.left + rect.width / 2;
            const checkY = rect.top + rect.height / 2;

            const elem = document.elementFromPoint(checkX, checkY);
            if (elem && elem.classList.contains('cell')) {
                const r = parseInt(elem.dataset.row);
                const c = parseInt(elem.dataset.col);
                if (canPlace(dragData.piece.matrix, r, c)) {
                    place(dragData.piece.matrix, dragData.piece.style, r, c);
                    activePieceEl.remove();
                    rackPieces[dragData.slotIndex] = null;
                    placed = true;

                    checkLines();
                    if (rackPieces.every(p => p === null)) fillRack();
                    if (!canMoveAny()) triggerGameOver();
                }
            }
        }

        // Якщо не поставили на поле — повертаємо розмір і кладемо назад
        if (!placed) {
            activePieceEl.style.position = '';
            activePieceEl.style.left = '';
            activePieceEl.style.top = '';
            const size = 22;
            activePieceEl.querySelectorAll('.p-cell').forEach(c => {
                c.style.width = `${size}px`;
                c.style.height = `${size}px`;
            });
            activePieceEl.style.width = `${dragData.piece.matrix[0].length * (size + 3)}px`;
        }

        activePieceEl = null;
        dragData = null;
    }

    function canPlace(matrix, sR, sC) {
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] === 1) {
                    let tr = sR + r, tc = sC + c;
                    if (tr >= BOARD_SIZE || tc >= BOARD_SIZE || board[tr][tc] !== 0) return false;
                }
            }
        }
        return true;
    }

    function showHover(matrix, sR, sC) {
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] === 1) {
                    let cell = boardEl.querySelector(`[data-row="${sR + r}"][data-col="${sC + c}"]`);
                    if (cell) cell.classList.add('hovered');
                }
            }
        }
    }

    function clearHover() {
        boardEl.querySelectorAll('.hovered').forEach(c => c.classList.remove('hovered'));
    }

    function place(matrix, style, sR, sC) {
        let pts = 0;
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] === 1) {
                    board[sR + r][sC + c] = style;
                    pts++;
                }
            }
        }
        addScore(pts);
        drawBoard();
    }

    function checkLines() {
        let rows = [], cols = [];
        for (let r = 0; r < BOARD_SIZE; r++) { if (board[r].every(x => x !== 0)) rows.push(r); }
        for (let c = 0; c < BOARD_SIZE; c++) {
            let full = true;
            for (let r = 0; r < BOARD_SIZE; r++) { if (board[r][c] === 0) full = false; }
            if (full) cols.push(c);
        }

        if (rows.length > 0 || cols.length > 0) {
            rows.forEach(r => { for (let c=0; c<BOARD_SIZE; c++) boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('clearing'); });
            cols.forEach(c => { for (let r=0; r<BOARD_SIZE; r++) boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('clearing'); });

            addScore((rows.length + cols.length) * 100);

            setTimeout(() => {
                rows.forEach(r => { for (let c=0; c<BOARD_SIZE; c++) board[r][c] = 0; });
                cols.forEach(c => { for (let r=0; r<BOARD_SIZE; r++) board[r][c] = 0; });
                drawBoard();
            }, 300);
        }
    }

    function addScore(p) {
        score += p;
        scoreEl.textContent = score;
        if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('vyshyvanka_blast_max', highScore);
        }
    }

    function canMoveAny() {
        return rackPieces.some(piece => {
            if (!piece) return false;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (canPlace(piece.matrix, r, c)) return true;
                }
            }
            return false;
        });
    }

    function triggerGameOver() {
        finalScoreEl.textContent = score;
        gameOverModal.classList.add('active');
    }

    document.getElementById('restart-btn').addEventListener('click', () => {
        board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        score = 0;
        scoreEl.textContent = '0';
        gameOverModal.classList.remove('active');
        createBoard();
        fillRack();
    });

    createBoard();
    fillRack();
</script>

</body>
</html>
